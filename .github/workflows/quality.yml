name: AiOS quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest pip-audit coverage
      - name: Test and coverage
        run: python -m coverage run --branch -m pytest -q && python -m coverage report --fail-under=70
      - name: AI quality gate
        run: python scripts/ai_quality_gate.py
      - name: Synthetic performance smoke
        run: python scripts/performance_smoke.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt && python -m pip_audit -r requirements-memory.txt
